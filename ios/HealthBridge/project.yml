name: HealthBridge
options:
  bundleIdPrefix: com.haru
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  HealthBridge:
    type: application
    platform: iOS
    sources:
      - path: HealthBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haru.healthbridge
        CODE_SIGN_ENTITLEMENTS: HealthBridge.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: HealthBridge reads your Health data to sync it to your private server.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    entitlements:
      path: HealthBridge.entitlements
    scheme:
      testTargets:
        - HealthBridgeTests
  HealthBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthBridgeTests
    dependencies:
      - target: HealthBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haru.healthbridge.tests
