name: HealthBridge iOS

on:
  push:
    branches: [healthkit-ios-bridge]
    paths:
      - 'ios/HealthBridge/**'
      - '.github/workflows/healthbridge-ios.yml'
  pull_request:
    paths:
      - 'ios/HealthBridge/**'
      - '.github/workflows/healthbridge-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthbridge-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Boot available iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Generate project
        working-directory: ios/HealthBridge
        run: xcodegen generate
      - name: Run unit tests
        working-directory: ios/HealthBridge
        run: xcodebuild test -project HealthBridge.xcodeproj -scheme HealthBridge -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' -destination-timeout 60 CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device app
        working-directory: ios/HealthBridge
        run: |
          xcodebuild build -project HealthBridge.xcodeproj -scheme HealthBridge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Ad-hoc sign and verify entitlements
        working-directory: ios/HealthBridge
        run: |
          set -euo pipefail
          app="$PWD/build/Build/Products/Release-iphoneos/HealthBridge.app"
          if [[ -d "$app/Frameworks/HealthBridgeCore.framework" ]]; then
            codesign --force --sign - "$app/Frameworks/HealthBridgeCore.framework"
          fi
          codesign --force --sign - --entitlements HealthBridge.entitlements "$app"
          bash scripts/verify-project.sh "$app"
      - name: Package IPA
        working-directory: ios/HealthBridge
        run: |
          rm -rf Payload HealthBridge-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HealthBridge.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload HealthBridge-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HealthBridge-unsigned
          path: ios/HealthBridge/HealthBridge-unsigned.ipa
          if-no-files-found: error
