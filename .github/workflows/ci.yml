name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Verify package and public deployment examples
        run: |
          test -x deploy/verify.sh
          bash deploy/verify.sh

      - name: Check patch hygiene
        run: git diff --check

      - name: Check public-tree sanitization
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import re

          blocked = [
              "yuz" + "uwkhk",
              "kannch" + "8765",
              "claude" + "-p",
              "sub" + "con",
              "relationship" + "-memory",
              "/srv/" + "haru-mcp-workspace",
              "rack" + "nerd",
              "tg" + "-bridge",
          ]
          credential_patterns = [
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"ghp_[A-Za-z0-9]{20,}"),
              re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode())
              data = path.read_bytes()
              text = data.decode("utf-8", errors="ignore")
              for marker in blocked:
                  if marker in text:
                      raise SystemExit(f"private identifier found in {path}: {marker}")
              for pattern in credential_patterns:
                  if pattern.search(text):
                      raise SystemExit(f"credential-like literal found in {path}: {pattern.pattern}")
          print("public_tree_sanitization=PASS")
